<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    Drapeaux de course, version 2 : toile à deux vagues, contour épais, mât à pommeau, ombre dure décalée de 1,4 px (même langage que les boutons).
    Utilisation : <svg width="24" height="20"><use href="#flag-jaune"/></svg>
    viewBox 0 0 32 26 (ratio 1.23). Tailles conseillées : 24x20 en ligne, 96x78 sur la page annexe.
    Couleurs : charbon #2E2A26, crème #F3EAD3, vert #2E7D5B, jaune #E2B04A,
    corail #DC6247, bleu #2F5D9E, orange #E07A1F.
  -->
  <defs>
    <path id="flag-shape" d="M6 4.5 C 10 1.5, 13.5 6.5, 18 3.5 C 22 1, 25.5 5, 29.5 3 L 29.5 16 C 25.5 18, 22 14, 18 16.5 C 13.5 19.5, 10 14.5, 6 17.5 Z"/>
    <clipPath id="flag-clip"><use href="#flag-shape"/></clipPath>
    <pattern id="flag-checker" width="6" height="6" patternUnits="userSpaceOnUse" x="6" y="3">
      <rect width="3" height="3" fill="#2E2A26"/><rect x="3" y="3" width="3" height="3" fill="#2E2A26"/>
      <rect x="3" width="3" height="3" fill="#F3EAD3"/><rect y="3" width="3" height="3" fill="#F3EAD3"/>
    </pattern>
    <g id="flag-pole">
      <rect x="3" y="3" width="2.4" height="21.5" rx="0.8" fill="#2E2A26"/>
      <circle cx="4.2" cy="2.6" r="2" fill="#2E2A26"/>
    </g>
    <use id="flag-shadow" href="#flag-shape" fill="#2E2A26" transform="translate(1.4 1.4)"/>
    <use id="flag-outline" href="#flag-shape" fill="none" stroke="#2E2A26" stroke-width="1.6" stroke-linejoin="round"/>
  </defs>

  <symbol id="flag-vert" viewBox="0 0 32 26">
    <use href="#flag-pole"/><use href="#flag-shadow"/><use href="#flag-shape" fill="#2E7D5B"/><use href="#flag-outline"/>
  </symbol>
  <symbol id="flag-jaune" viewBox="0 0 32 26">
    <use href="#flag-pole"/><use href="#flag-shadow"/><use href="#flag-shape" fill="#E2B04A"/><use href="#flag-outline"/>
  </symbol>
  <symbol id="flag-rouge" viewBox="0 0 32 26">
    <use href="#flag-pole"/><use href="#flag-shadow"/><use href="#flag-shape" fill="#DC6247"/><use href="#flag-outline"/>
  </symbol>
  <symbol id="flag-bleu" viewBox="0 0 32 26">
    <use href="#flag-pole"/><use href="#flag-shadow"/><use href="#flag-shape" fill="#2F5D9E"/><use href="#flag-outline"/>
  </symbol>
  <symbol id="flag-blanc" viewBox="0 0 32 26">
    <use href="#flag-pole"/><use href="#flag-shadow"/><use href="#flag-shape" fill="#F3EAD3"/><use href="#flag-outline"/>
  </symbol>
  <symbol id="flag-noir" viewBox="0 0 32 26">
    <use href="#flag-pole"/><use href="#flag-shadow"/><use href="#flag-shape" fill="#2E2A26"/><use href="#flag-outline"/>
  </symbol>
  <symbol id="flag-raye" viewBox="0 0 32 26">
    <use href="#flag-pole"/><use href="#flag-shadow"/>
    <g clip-path="url(#flag-clip)">
      <rect x="6" y="0" width="24" height="20" fill="#E2B04A"/>
      <rect x="9.5" y="0" width="3.5" height="20" fill="#DC6247"/>
      <rect x="16.5" y="0" width="3.5" height="20" fill="#DC6247"/>
      <rect x="23.5" y="0" width="3.5" height="20" fill="#DC6247"/>
    </g>
    <use href="#flag-outline"/>
  </symbol>
  <symbol id="flag-noir-orange" viewBox="0 0 32 26">
    <use href="#flag-pole"/><use href="#flag-shadow"/><use href="#flag-shape" fill="#2E2A26"/>
    <circle cx="17.8" cy="10" r="4" fill="#E07A1F"/>
    <use href="#flag-outline"/>
  </symbol>
  <symbol id="flag-noir-blanc" viewBox="0 0 32 26">
    <use href="#flag-pole"/><use href="#flag-shadow"/>
    <g clip-path="url(#flag-clip)">
      <rect x="6" y="0" width="24" height="20" fill="#F3EAD3"/>
      <path d="M6 17.5 L29.5 3 L29.5 16 Z" fill="#2E2A26"/>
    </g>
    <use href="#flag-outline"/>
  </symbol>
  <symbol id="flag-damier" viewBox="0 0 32 26">
    <use href="#flag-pole"/><use href="#flag-shadow"/>
    <g clip-path="url(#flag-clip)"><rect x="6" y="0" width="24" height="20" fill="url(#flag-checker)"/></g>
    <use href="#flag-outline"/>
  </symbol>
</svg>
